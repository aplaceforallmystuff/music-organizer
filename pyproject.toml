[project]
name = "music-organizer"
version = "0.1.0"
description = "Organize music library by extracting metadata and restructuring folders"
requires-python = ">=3.10"
dependencies = [
    "mutagen>=1.47.0",      # Audio metadata extraction (MP3, FLAC, M4A, etc.)
    "musicbrainzngs>=0.7",  # MusicBrainz API for missing metadata lookup
    "python3-discogs-client>=2.7",  # Discogs API for release verification
    "pyacoustid>=1.2.0",    # Audio fingerprinting for duplicate detection
    "Pillow>=10.0.0",       # Album art processing
    "requests>=2.31.0",     # HTTP requests for album art downloads
    "rich>=13.0.0",         # Beautiful terminal output and progress bars
    "click>=8.1.0",         # CLI framework
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[project.scripts]
music-organizer = "music_organizer.cli:main"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
